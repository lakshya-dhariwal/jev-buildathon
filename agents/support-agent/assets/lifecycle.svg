<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect width="1400" height="960" fill="#ffffff"/>
  <g stroke="#1e1e1e" stroke-width="3" fill="none">

    <text x="40" y="66" font-size="42" fill="#1e1e1e" stroke="none" font-weight="bold">How a support ticket becomes a save</text>

    <!-- the ticket -->
    <rect x="40" y="120" width="290" height="185" fill="#ffec99"/>
    <text x="62" y="164" font-size="24" fill="#1e1e1e" stroke="none" font-weight="bold">A ticket arrives</text>
    <text x="62" y="200" font-size="21" fill="#1e1e1e" stroke="none">"Charged TWICE.</text>
    <text x="62" y="232" font-size="21" fill="#1e1e1e" stroke="none">Get me a human</text>
    <text x="62" y="264" font-size="21" fill="#1e1e1e" stroke="none">being, NOW!"</text>

    <line x1="334" y1="212" x2="398" y2="212" marker-end="url(#arr)"/>

    <!-- the agent -->
    <rect x="406" y="120" width="270" height="185" fill="#a5d8ff"/>
    <text x="430" y="164" font-size="26" fill="#1e1e1e" stroke="none" font-weight="bold">Support agent</text>
    <text x="430" y="202" font-size="20" fill="#1e1e1e" stroke="none">reads the ticket,</text>
    <text x="430" y="234" font-size="20" fill="#1e1e1e" stroke="none">plans an action</text>
    <text x="430" y="266" font-size="20" fill="#1e1e1e" stroke="none">(cancel, refund, reply)</text>

    <line x1="680" y1="212" x2="748" y2="212" marker-end="url(#arr)"/>
    <text x="606" y="192" font-size="20" fill="#1e1e1e" stroke="none" font-weight="bold">every tool call</text>

    <!-- the policy layer -->
    <rect x="756" y="90" width="604" height="310" fill="#ffffff" stroke="#2b8a3e" stroke-width="5"/>
    <text x="782" y="138" font-size="26" fill="#2b8a3e" stroke="none" font-weight="bold">FailproofAI checks it first (PreToolUse)</text>
    <rect x="782" y="158" width="552" height="106" fill="#d3f9d8"/>
    <text x="802" y="194" font-size="22" fill="#1e1e1e" stroke="none" font-weight="bold">CODE checks - free, instant, exact</text>
    <text x="802" y="226" font-size="19" fill="#1e1e1e" stroke="none">order still pending? &#183; identity verified?</text>
    <text x="802" y="254" font-size="19" fill="#1e1e1e" stroke="none">refund to original card? &#183; amount &#8804; order total?</text>
    <rect x="782" y="278" width="552" height="106" fill="#e7f5ff"/>
    <text x="802" y="314" font-size="22" fill="#1e1e1e" stroke="none" font-weight="bold">JEV checks - judgment calls code can't make</text>
    <text x="802" y="346" font-size="19" fill="#1e1e1e" stroke="none">did the customer confirm THIS order?</text>
    <text x="802" y="374" font-size="19" fill="#1e1e1e" stroke="none">is this text a planted instruction? &#183; needs a human?</text>

    <!-- allow path -->
    <line x1="1300" y1="404" x2="1300" y2="466" marker-end="url(#arr)"/>
    <text x="1314" y="444" font-size="23" fill="#2b8a3e" stroke="none" font-weight="bold">allow</text>
    <rect x="1060" y="474" width="290" height="130" fill="#ffe8cc"/>
    <text x="1082" y="514" font-size="24" fill="#1e1e1e" stroke="none" font-weight="bold">Action runs</text>
    <text x="1082" y="548" font-size="18" fill="#1e1e1e" stroke="none">world records it</text>
    <text x="1082" y="578" font-size="18" fill="#1e1e1e" stroke="none">(harm counted if bad)</text>

    <!-- deny path -->
    <line x1="820" y1="404" x2="820" y2="452" marker-end="url(#arr)"/>
    <text x="738" y="440" font-size="23" fill="#c92a2a" stroke="none" font-weight="bold">deny &#x2298;</text>
    <rect x="440" y="460" width="440" height="150" fill="#ffc9c9"/>
    <text x="462" y="500" font-size="24" fill="#1e1e1e" stroke="none" font-weight="bold">Deny = coaching, not a wall</text>
    <text x="462" y="534" font-size="19" fill="#1e1e1e" stroke="none">"verify identity first"</text>
    <text x="462" y="564" font-size="19" fill="#1e1e1e" stroke="none">"escalate to billing first"</text>
    <text x="462" y="594" font-size="19" fill="#1e1e1e" stroke="none">"original payment method only"</text>

    <path d="M 500 460 C 470 395, 490 345, 520 312" marker-end="url(#arr)"/>
    <text x="352" y="392" font-size="19" fill="#1e1e1e" stroke="none">agent adapts</text>

    <!-- org chart -->
    <path d="M 1180 608 C 1140 648, 1110 668, 1072 682" marker-end="url(#arr)"/>
    <text x="1080" y="648" font-size="18" fill="#1e1e1e" stroke="none">escalations routed</text>
    <rect x="720" y="650" width="344" height="140" fill="#e5dbff"/>
    <text x="742" y="690" font-size="23" fill="#1e1e1e" stroke="none" font-weight="bold">org-chart.json</text>
    <text x="742" y="724" font-size="19" fill="#1e1e1e" stroke="none">support: Priya &#183; billing: Rohan</text>
    <text x="742" y="754" font-size="19" fill="#1e1e1e" stroke="none">technical: Arjun</text>

    <!-- cloud -->
    <line x1="1210" y1="608" x2="1210" y2="786" marker-end="url(#arr)"/>
    <rect x="1060" y="794" width="310" height="140" fill="#f8f0fc"/>
    <text x="1082" y="828" font-size="21" fill="#1e1e1e" stroke="none" font-weight="bold">Session &#8594; FailproofAI Cloud</text>
    <text x="1082" y="860" font-size="18" fill="#1e1e1e" stroke="none">9 evals score what happened</text>
    <text x="1082" y="890" font-size="18" fill="#1e1e1e" stroke="none">a blocked call never executed</text>
    <text x="1082" y="918" font-size="18" fill="#1e1e1e" stroke="none">= zero harm cost</text>

    <text x="40" y="925" font-size="25" fill="#1e1e1e" stroke="none" font-style="italic">Agents don't fail because the model is dumb. They fail because nothing checks the action.</text>
  </g>
</svg>

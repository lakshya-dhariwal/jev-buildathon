<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1280" height="790" fill="#ffffff"/>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none">

    <text x="48" y="56" font-size="30" fill="#1a1a1a" stroke="none" font-weight="bold">Jev saved the support agent from itself</text>
    <text x="48" y="86" font-size="15" fill="#6b7280" stroke="none">every tool call passes the policy wall before it runs</text>

    <!-- ticket -->
    <rect x="48" y="140" width="230" height="120" rx="6" fill="#f7f7f8"/>
    <text x="64" y="172" font-size="18" fill="#1a1a1a" stroke="none" font-weight="bold">A ticket arrives</text>
    <text x="64" y="202" font-size="16" fill="#1a1a1a" stroke="none">"Charged TWICE.</text>
    <text x="64" y="228" font-size="16" fill="#1a1a1a" stroke="none">Get me a human</text>
    <text x="64" y="252" font-size="16" fill="#1a1a1a" stroke="none">being, NOW!"</text>

    <line x1="278" y1="200" x2="332" y2="200" marker-end="url(#a3)"/>

    <!-- agent -->
    <rect x="338" y="140" width="210" height="120" rx="6" fill="#f7f7f8"/>
    <text x="354" y="172" font-size="20" fill="#1a1a1a" stroke="none" font-weight="bold">Support agent</text>
    <text x="354" y="202" font-size="14" fill="#1a1a1a" stroke="none">reads the ticket and</text>
    <text x="354" y="226" font-size="14" fill="#1a1a1a" stroke="none">decides to close it</text>
    <text x="354" y="250" font-size="14" fill="#1a1a1a" stroke="none">without a human</text>

    <line x1="548" y1="200" x2="642" y2="200" marker-end="url(#a3)"/>
    <text x="595" y="188" font-size="13" fill="#6b7280" stroke="none" text-anchor="middle">every action</text>

    <!-- policy wall -->
    <rect x="648" y="110" width="584" height="320" rx="8" fill="#ffffff" stroke-width="2"/>
    <text x="672" y="146" font-size="20" fill="#1a1a1a" stroke="none" font-weight="bold">FailproofAI checks the action first</text>

    <rect x="672" y="166" width="536" height="112" rx="6" fill="#f4f4f5"/>
    <text x="690" y="196" font-size="17" fill="#1a1a1a" stroke="none" font-weight="bold">CODE - exact facts, free and instant</text>
    <text x="690" y="228" font-size="15" fill="#374151" stroke="none">Is this order still pending?  ·  Did they prove identity?</text>
    <text x="690" y="256" font-size="15" fill="#374151" stroke="none">Refund to the same card, and no more than the order cost?</text>

    <rect x="672" y="294" width="536" height="112" rx="6" fill="#eef2ff"/>
    <text x="690" y="324" font-size="17" fill="#1a1a1a" stroke="none" font-weight="bold">JEV - the judgment calls, in plain words</text>
    <text x="690" y="356" font-size="15" fill="#374151" stroke="none">Did the customer really confirm cancelling THIS order?</text>
    <text x="690" y="384" font-size="15" fill="#374151" stroke="none">Is this 'approval' planted text?  ·  Too angry for a bot?</text>

    <!-- deny path -->
    <line x1="700" y1="430" x2="700" y2="464" marker-end="url(#a3)"/>
    <text x="712" y="456" font-size="14" fill="#dc2626" stroke="none" font-weight="bold">deny</text>
    <rect x="480" y="470" width="340" height="120" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="496" y="500" font-size="17" fill="#1a1a1a" stroke="none" font-weight="bold">Denied, e.g.:</text>
    <text x="496" y="530" font-size="14" fill="#1a1a1a" stroke="none">&#x2298; cancel a shipped order</text>
    <text x="496" y="554" font-size="14" fill="#1a1a1a" stroke="none">&#x2298; refund to a comment's UPI id</text>
    <text x="496" y="578" font-size="14" fill="#1a1a1a" stroke="none">&#x2298; close when a human was asked for</text>

    <!-- allow path -->
    <line x1="1140" y1="430" x2="1140" y2="464" marker-end="url(#a3)"/>
    <text x="1152" y="456" font-size="14" fill="#16a34a" stroke="none" font-weight="bold">allow</text>
    <rect x="870" y="470" width="310" height="120" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="886" y="500" font-size="17" fill="#1a1a1a" stroke="none" font-weight="bold">Allowed, e.g.:</text>
    <text x="886" y="530" font-size="14" fill="#1a1a1a" stroke="none">cancel a pending order,</text>
    <text x="886" y="554" font-size="14" fill="#1a1a1a" stroke="none">confirmed by the customer</text>
    <text x="886" y="578" font-size="14" fill="#1a1a1a" stroke="none">- the action actually runs</text>

    <!-- agent adapts: elbow back to the agent -->
    <path d="M 480 530 H 400 V 266" marker-end="url(#a3)"/>
    <text x="240" y="415" font-size="14" fill="#6b7280" stroke="none">agent adapts</text>

    <!-- second row: org chart -->
    <rect x="480" y="640" width="340" height="90" rx="6" fill="#f7f7f8"/>
    <text x="496" y="672" font-size="16" fill="#1a1a1a" stroke="none" font-weight="bold">org-chart.json</text>
    <text x="496" y="698" font-size="14" fill="#374151" stroke="none">support: Priya  ·  billing: Rohan</text>
    <text x="496" y="720" font-size="14" fill="#374151" stroke="none">technical: Arjun</text>

    <!-- escalations routed: allow box -> org chart (elbow) -->
    <path d="M 950 590 V 615 H 645 V 634" marker-end="url(#a3)"/>
    <text x="828" y="610" font-size="13" fill="#6b7280" stroke="none" text-anchor="middle">escalations routed</text>

    <!-- second row: cloud -->
    <line x1="1025" y1="590" x2="1025" y2="634" marker-end="url(#a3)"/>
    <rect x="870" y="640" width="310" height="90" rx="6" fill="#f7f7f8"/>
    <text x="886" y="672" font-size="16" fill="#1a1a1a" stroke="none" font-weight="bold">Session &#8594; FailproofAI Cloud</text>
    <text x="886" y="698" font-size="14" fill="#374151" stroke="none">12 evals score what happened</text>
    <text x="886" y="720" font-size="14" fill="#374151" stroke="none">a blocked call = zero harm cost</text>

    <text x="48" y="766" font-size="15" fill="#6b7280" stroke="none" font-style="italic">Agents don't fail because the model is dumb. They fail because nothing checks the action.</text>
  </g>
</svg>
